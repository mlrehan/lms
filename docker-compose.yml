services:
  # =============================================================================
  # DATABASE: PostgreSQL 16 with TLS & Least-Privilege Role Setup
  # =============================================================================
  postgres:
    image: postgres:16
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lms_db}
      POSTGRES_USER: ${DATABASE_MIGRATION_USER:-lms_migrator}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:-lms_secure_migrator_pw}
      DATABASE_RUNTIME_USER: ${DATABASE_RUNTIME_USER:-lms_runtime}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:-lms_secure_runtime_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem", "-c", "ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key"]
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_MIGRATION_USER:-lms_migrator} -d ${DATABASE_NAME:-lms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # CACHE & REALTIME BUS: Redis 7
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
               exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes;
             else
               exec redis-server --appendonly yes;
             fi"
    volumes:
      - redis_data:/data
    networks:
      - lms-network
    healthcheck:
      test: >
        sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
                 redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG;
               else
                 redis-cli ping | grep PONG;
               fi"
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # BACKEND: FastAPI Python 3.13 ASGI Application
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - storage_data:/app/var/storage
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/livez || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # BACKGROUND WORKER: Outbound Webhook Queue Dispatcher
  # =============================================================================
  webhooks-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lms-webhooks-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - storage_data:/app/var/storage
    command: ["python", "-m", "backend.cli.dispatch_webhooks", "--interval", "30"]
    networks:
      - lms-network

  # =============================================================================
  # FRONTEND: Next.js 16 Standalone BFF Console
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - LMS_API_URL=http://backend:8000/api/v1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # REVERSE PROXY: Nginx Alpine with SSL Termination & Rate Limiting
  # =============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: lms-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    profiles:
      - docker-nginx
    networks:
      - lms-network

  # =============================================================================
  # SSL AUTOMATION: Certbot Let's Encrypt Certificate Renewer
  # =============================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: lms-certbot
    restart: unless-stopped
    profiles:
      - docker-nginx
    volumes:
      - certbot_conf:/etc/letsencrypt:rw
      - certbot_www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - lms-network

# =============================================================================
# PERSISTENT VOLUMES
# =============================================================================
volumes:
  postgres_data:
    name: lms_postgres_data
  redis_data:
    name: lms_redis_data
  storage_data:
    name: lms_storage_data
  certbot_conf:
    name: lms_certbot_conf
  certbot_www:
    name: lms_certbot_www

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  lms-network:
    name: lms-network
    driver: bridge

